# TEMPORARY, removed before this pull request merges: the Windows legs of release.yml (build,
# bundle, collect) on the pull request's head, to prove the CRT link fix before a release run.
name: Windows build probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TAURI_PROJECT_PATH: apps/desktop/src-tauri
  RELEASE_TARGETS_FILE: .github/release-targets.json
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows probe ${{ matrix.target }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - target: aarch64-pc-windows-msvc
            bundles: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: tauri-release-${{ matrix.target }}
          save-if: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (no bundle), as release.yml does
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm tauri build --no-bundle --target "$TARGET"

      - name: Bundle, as release.yml does
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri bundle --target "$TARGET" --bundles "$BUNDLES"

      - name: Collect, as release.yml does
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          python3 .github/scripts/tauri-release.py collect
          --project "$TAURI_PROJECT_PATH"
          --target "$TARGET"
          --targets-file "$RELEASE_TARGETS_FILE"
          --out dist
          --evidence "evidence/$TARGET.json"
          && ls -l dist
