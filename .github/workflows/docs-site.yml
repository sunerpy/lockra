# Builds firlab.app/lockra from a pull request's pages against firlab's public main, so a dead
# link, an unknown component, a page missing in one language, a banned word or a malformed home
# page fails before the merge rather than in publish-site.yml after it. Nothing is published and
# no secret is read, so a fork's pull request runs it the same way. Advisory: not part of
# CI Success. docs/site/README.md describes the whole path.
name: Docs site

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "docs/architecture.md"
      - "docs/formats.md"
      - "docs/security.md"
      - "docs/release.md"
      - ".github/workflows/docs-site.yml"
      - ".github/workflows/publish-site.yml"

concurrency:
  group: docs-site-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Docs site · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Lockra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lockra
          persist-credentials: false

      - name: Checkout firlab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sunerpy/firlab
          path: firlab
          persist-credentials: false

      # The site installs on its own (its package.json pins pnpm); pnpm before setup-node so the
      # pnpm cache resolves.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: firlab/lockra/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: firlab/.node-version
          cache: pnpm
          cache-dependency-path: firlab/lockra/pnpm-lock.yaml

      - name: Sync the pages
        run: ./firlab/lockra/scripts/sync-lockra-docs.sh "$GITHUB_WORKSPACE/lockra"

      - name: Install the site's dependencies
        working-directory: firlab/lockra
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: firlab/lockra
        run: pnpm build

      # A misconfigured locale emits only the root one, which still looks like a green build.
      - name: Check both languages were emitted
        working-directory: firlab/lockra
        run: ./scripts/check-dist.sh dist
