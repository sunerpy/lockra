# CI for Lockra: a Tauri v2 desktop app with the Cargo workspace at the repository root (seven
# crates plus the shell in apps/desktop/src-tauri) and three pnpm packages.
#
# Rendered from the github-project-scaffold tauri profile (ci-tauri.yml) and adapted, so the file
# is in .github/scaffold.json "drift_allow". What differs from the template, and why:
# - `rust` covers the whole workspace; the crates' line-coverage floor (make coverage, 90 %)
#   replaces the plain test run because it runs the same tests, and the shell's own tests
#   (tests/ipc.rs on Tauri's mock runtime) run beside it.
# - `frontend` runs the tests with each package's coverage floor (vitest thresholds, 85 %).
# - `repo` runs the repository's static gates: no colour literals in components, a release web
#   bundle without development code, actionlint and shellcheck.
# - `deny` checks licences, bans, sources and RustSec advisories of the shipped graph.
# - `smoke` drives the real app under Xvfb (scripts/smoke-desktop-linux.sh): it types a master
#   password, imports from the clipboard, compares a copied code with RFC 6238, decodes the
#   export QR code, turns Touch ID on and unlocks with it (a debug build's stand-in check, since
#   the runner has no sensor) and closes the window with its own button. Then two copies of the
#   app sync through the Versity S3 gateway in Docker (scripts/smoke-sync-linux.sh): one sets up
#   the space in Settings › Sync, the other joins from the welcome screen with the sync key, their
#   changes meet, and an older snapshot put back on the storage is refused.
# - `sync-it` runs the sync storage against real servers in Docker (make sync-it): the Versity S3
#   gateway, for S3's conditional writes, and rclone's WebDAV server.
# - `windows-check` is the template's optional early warning, enabled: the shell and the
#   clipboard adapter carry Windows-only code.
# - `macos-check` is the same warning for macOS: the shell's Touch ID check is macOS-only code.
# - `android` builds the phone app (apps/mobile) for arm64, signs it with a key made for the run and
#   checks the packages; `android-device` runs that APK on an emulator: it creates a vault, locks on
#   leaving and unlocks.
# There are still no macOS or Windows test legs: the release bundle matrix is the native proof.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # npm | pnpm | bun. Scripts fmt:check, lint, test, build are the contract.
  PACKAGE_MANAGER: pnpm
  TAURI_PROJECT_PATH: apps/desktop/src-tauri
  RELEASE_TARGETS_FILE: .github/release-targets.json
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: "1"
  # Cargo subcommands and tools the gates use, pinned (the Rust toolchain comes from
  # rust-toolchain.toml through the toolchain step below).
  CARGO_LLVM_COV_VERSION: 0.8.7
  CARGO_DENY_VERSION: 0.19.9
  ACTIONLINT_VERSION: 1.7.12
  # The version `make check` uses locally: the image's own shellcheck is older and flags what
  # 0.11 accepts (SC2015 on `[ … ] && kill … || true`, found on the first CI run).
  SHELLCHECK_VERSION: 0.11.0
  TAURI_DRIVER_VERSION: 2.0.6

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up pnpm
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        if: env.PACKAGE_MANAGER != 'bun'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: ${{ env.PACKAGE_MANAGER }}

      - name: Install dependencies (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            *) echo "::error::unsupported PACKAGE_MANAGER '$PACKAGE_MANAGER'"; exit 1 ;;
          esac

      - name: Format check
        run: '"$PACKAGE_MANAGER" run fmt:check'

      - name: Lint
        run: '"$PACKAGE_MANAGER" run lint'

      # The tests, failing under each package's line-coverage floor (vitest.config.ts).
      - name: Test with coverage floors
        run: '"$PACKAGE_MANAGER" run test:coverage'

      - name: Build
        run: '"$PACKAGE_MANAGER" run build'

  rust:
    name: Rust (Linux)
    # ubuntu-22.04 is the glibc floor Tauri documents for Linux bundles; keep CI
    # on the same image so linker and webkit versions match the release leg.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds build.frontendDist when the app is built with the
      # custom protocol; build it first so every target below compiles the same way.
      - name: Build frontend for embedding
        run: pnpm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy,llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: tauri-ci

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Runs every crate's tests and fails under the 90 % line floor (Makefile, CRATE_COVERAGE_MIN).
      - name: Crate tests with the coverage floor
        run: make coverage

      # The shells are outside the crates' floor; their IPC tests run on Tauri's mock runtime.
      - name: Shell tests
        run: cargo test --locked -p lockra-desktop -p lockra-mobile --all-targets

  config:
    name: Release config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tauri.conf.json, package.json and updater pubkey
        run: >-
          python3 .github/scripts/tauri-release.py check-config
          --project "$TAURI_PROJECT_PATH" --targets-file "$RELEASE_TARGETS_FILE"

      - name: Validate the release target manifest
        run: python3 .github/scripts/tauri-release.py matrix --file "$RELEASE_TARGETS_FILE"

      # Every leg's collect step against the real manifest with the updater off (no
      # bundle.createUpdaterArtifacts): the macOS legs ship their dmg, missing bundles fail.
      - name: Test bundle collection
        run: python3 .github/scripts/test-tauri-release.py

  repo:
    name: Repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # install-action has no actionlint manifest (it would look for a crate of that name), so
      # the release archive is fetched and checked against the SHA-256 the release publishes.
      - name: Install actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >>"$GITHUB_PATH"

      - name: No colour literals in components
        run: scripts/check-no-literal-colors.sh

      # Builds the release web bundle and fails on development code or a remote URL in it.
      - name: Release web bundle
        run: scripts/check-web-bundle.sh

      - name: actionlint
        run: actionlint

      - name: Install shellcheck
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: shellcheck@${{ env.SHELLCHECK_VERSION }}

      - name: shellcheck
        run: shellcheck scripts/*.sh .github/scripts/*.sh

      # The one-line installers, offline: a fake GitHub and fake package managers for install.sh,
      # and PowerShell 7 with the cmdlets that reach the network or the registry replaced for
      # install.ps1. install-scripts.yml runs them for real on each system.
      - name: Install scripts
        run: |
          scripts/test-install.sh
          pwsh -NoProfile -File scripts/test-install.ps1

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      # Licences, bans (no network stack) and sources (deny.toml); advisories need the RustSec
      # database, which only the network has.
      - name: cargo deny
        run: cargo deny check licenses bans sources advisories

  smoke:
    name: Desktop smoke (Xvfb)
    runs-on: ubuntu-22.04
    # The desktop smoke and the two-app sync smoke, one after the other.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the app's and the display stack's dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils \
            xvfb x11-utils xdotool xclip webkit2gtk-driver

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: tauri-smoke

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"

      - name: Drive the app (make smoke-desktop)
        run: make smoke-desktop

      - name: Two apps syncing through S3 (make smoke-sync)
        run: make smoke-sync

      # A process that dies mid-session (the app, its web process or WebKitWebDriver) leaves a
      # segfault or an OOM kill here, which no log of the run shows.
      - name: Kernel messages after a failure
        if: failure()
        run: sudo dmesg --ctime | grep -iE 'segfault|killed process|out of memory|general protection|traps:' | tail -n 40 || true

      - name: Screenshots of the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-screens
          path: |
            docs/acceptance/screens/desktop
            docs/acceptance/screens/sync
          if-no-files-found: ignore
          retention-days: 7

  sync-it:
    name: Sync storage (S3, WebDAV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: sync-it

      # Starts both servers on free loopback ports with a throwaway password, runs
      # crates/lockra-remote/tests/live.rs with LOCKRA_IT_REQUIRED=1 and removes the containers.
      - name: Against the servers (make sync-it)
        run: make sync-it

  # The template's optional early warning for Windows-only compile breaks (about 6-10 minutes with
  # a warm cache; a full Windows bundle leg is 15-36 minutes).
  windows-check:
    name: Windows cargo check
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: tauri-ci-windows-check
      - name: Create an empty frontendDist so generate_context! compiles
        shell: bash
        run: mkdir -p apps/desktop/dist
      # The phone shell (lockra-mobile) is never built for Windows; the `android` job checks it.
      - name: Cargo check
        shell: bash
        run: cargo check --locked --workspace --exclude lockra-mobile --all-targets

  # The same early warning for macOS-only code (the shell's Touch ID check), on the runner the
  # release bundles macOS on.
  macos-check:
    name: macOS cargo check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0
          components: clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: tauri-ci-macos-check
      - name: Create an empty frontendDist so generate_context! compiles
        run: mkdir -p apps/desktop/dist
      - name: Clippy
        run: cargo clippy --locked -p lockra-desktop --all-targets -- -D warnings

  # The phone app (apps/mobile): clippy for aarch64-linux-android over every workspace crate it
  # links, then the release APK and AAB built unsigned, signed in a step of their own with a key
  # made for this run, and checked as a release would check them (one signer, 16 KB pages, the
  # package's name and version). The APK goes on to `android-device`.
  android:
    name: Android (arm64 build and package checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Android toolchain (JDK 21; SDK platform, build tools and NDK pinned)
        run: .github/scripts/android-toolchain.sh

      - name: Install Rust toolchain (and aarch64-linux-android)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0
          components: clippy
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: tauri-ci-android

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Clippy for Android (make android-clippy)
        run: make android-clippy

      # Unsigned: the signing step below holds the key, so it never sits in the step that runs the
      # dependencies' build code. The lockfile's Tauri CLI, as the desktop release uses it.
      - name: Build the unsigned release APK and AAB (arm64)
        working-directory: apps/mobile
        run: pnpm tauri android build --ci --target aarch64 --apk --aab

      # A key made here (PKCS12: one password for the store and the key); its certificate's
      # SHA-256 is what the package checks expect.
      - name: Sign with a key made for this run
        run: |
          set -euo pipefail
          ANDROID_KEYSTORE_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEYSTORE=$RUNNER_TEMP/ci-android.jks ANDROID_KEY_ALIAS=lockra-ci ANDROID_KEYSTORE_PASSWORD
          export ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          keytool -genkeypair -noprompt -keystore "$ANDROID_KEYSTORE" -storetype PKCS12 -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Lockra CI" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
          digest=$(keytool -list -v -keystore "$ANDROID_KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          [ -n "$digest" ] || { echo "::error::no certificate digest for the CI key"; exit 1; }
          echo "CI_ANDROID_CERT_SHA256=$digest" >>"$GITHUB_ENV"
          out=apps/mobile/src-tauri/gen/android/app/build/outputs
          .github/scripts/sign-android-package.sh "$out/apk/universal/release/app-universal-release-unsigned.apk" \
            "$out/bundle/universalRelease/app-universal-release.aab" android-bundle "$(jq -r .version package.json)"

      - name: Check the packages
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          .github/scripts/check-android-package.sh "android-bundle/apk/Lockra_${version}_android_arm64.apk" \
            "android-bundle/aab/Lockra_${version}_android_arm64.aab" "$CI_ANDROID_CERT_SHA256" "$version"

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lockra-android-apk
          path: android-bundle/apk/
          if-no-files-found: error
          retention-days: 3

  # The app on a device: the APK the `android` job built runs on an Android 15 emulator (x86_64,
  # which runs the arm64 code through its ARM translation; KVM on the hosted runner). It installs,
  # creates a vault, locks when it leaves the screen and unlocks again, with nothing fatal in its
  # log (.github/scripts/android-device-smoke.sh). The log, the crash buffer, the exit reason and
  # the UI tree upload either way.
  android-device:
    name: Android (runs on an emulator)
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout (the smoke script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lockra-android-apk
          path: android-apk

      # The hosted runner has KVM; this lets the emulator use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/android-device-smoke.sh android-apk device

      - name: Upload the device logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device
          path: device/
          if-no-files-found: warn
          retention-days: 7

  ci-success:
    name: CI Success
    needs:
      [
        frontend,
        rust,
        config,
        repo,
        deny,
        smoke,
        sync-it,
        windows-check,
        macos-check,
        android,
        android-device,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"
