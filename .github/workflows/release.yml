# Same-run release for a Tauri v2 desktop application.
#
# Topology (identical to the Go, Rust and Node profiles): release-please owns
# the version, the tag and a DRAFT Release; every job below runs in the same
# workflow run gated on release_created; the terminal job verifies every remote
# asset and flips the draft. Nothing listens on `push: tags` or `release:`
# because events created with GITHUB_TOKEN never start workflows.
#
# Tauri-specific decisions (references/tauri-release.md):
# - Builds use the project's own lockfile-pinned Tauri CLI, not
#   tauri-apps/tauri-action, so latest.json is written exactly once after every
#   leg has finished and is verified against the configured pubkey before it is
#   uploaded.
# - `tauri build --no-bundle` runs the frontend toolchain and Rust build scripts
#   WITHOUT any signing material; `tauri bundle` is the only step that sees
#   TAURI_SIGNING_PRIVATE_KEY and the per-OS Apple/Azure secrets.
# - The signing-key guard in `preflight` fails before any 15-36 minute leg
#   starts when the updater is enabled but the key secret is missing.
# - Attestation runs in the no-compile `updater` job over the downloaded bytes,
#   so no job that executes dependency code holds id-token: write.
#
# Out of scope: app stores, Snap/Flatpak/AUR, iOS, non-GitHub update servers,
# certificate procurement, and candidate promotion (deferred until the same-run
# profile has shipped real releases; see the reference).
#
# Lockra adaptations (the file is in .github/scaffold.json "drift_allow"): the Cargo
# workspace sits at the repository root, so TAURI_PROJECT_PATH names the shell crate in
# apps/desktop/src-tauri and rust-cache restores the root target/ (". -> target");
# `pnpm tauri` is the root script that runs the desktop package's pinned Tauri CLI. The
# updater is on (bundle.createUpdaterArtifacts and plugins.updater in tauri.conf.json): every
# package is signed, and the updater job writes latest.json with a key per target and per
# installer, verifies every signature against the configured pubkey, and writes SHA256SUMS and
# the attestations. The Android app (apps/mobile) has a leg of its own, `bundle-android`: the APK
# for the releases page and the AAB for Google Play, signed with the project's Android key after an
# unsigned build and checked against the certificate .github/android-signing.json pins; they go
# into SHA256SUMS and the attestations with the rest, and into no updater manifest (the phone
# updates from the store or the releases page).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing draft release tag to rebuild, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # npm | pnpm | bun. The Tauri CLI is invoked through this package manager.
  PACKAGE_MANAGER: pnpm
  TAURI_PROJECT_PATH: apps/desktop/src-tauri
  RELEASE_TARGETS_FILE: .github/release-targets.json
  ANDROID_SIGNING_FILE: .github/android-signing.json
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build_artifacts: ${{ steps.gate.outputs.build_artifacts }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tooling comes from the workflow's own commit on the protected default
      # branch, never from a tag or a dispatched branch.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release gate
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RUN_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: main
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/resolve-release-gate.sh

  preflight:
    name: Preflight
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      updater_enabled: ${{ steps.config.outputs.updater_enabled }}
      pubkey: ${{ steps.config.outputs.pubkey }}
      product_name: ${{ steps.config.outputs.product_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Verify the tag resolves to the released commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_SHA" ]; then
            echo "::error::checked-out tag commit $head != release commit $RELEASE_SHA"
            exit 1
          fi

      - name: Check version source, updater pubkey and bundle targets
        id: config
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: >-
          python3 .github/scripts/tauri-release.py check-config
          --project "$TAURI_PROJECT_PATH"
          --expect-version "$VERSION"
          --targets-file "$RELEASE_TARGETS_FILE"
          --github-output "$GITHUB_OUTPUT"

      # Fail closed before any expensive leg starts. Secrets are only compared
      # to the empty string inside env; the value never reaches the shell.
      - name: Require the updater signing key when the updater is enabled
        env:
          UPDATER_ENABLED: ${{ steps.config.outputs.updater_enabled }}
          SIGNING_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$UPDATER_ENABLED" = true ] && [ "$SIGNING_KEY_PRESENT" != true ]; then
            echo "::error::bundle.createUpdaterArtifacts is enabled but the TAURI_SIGNING_PRIVATE_KEY secret is missing"
            exit 1
          fi

      # The macOS packages are signed with the project's self-signed release certificate, so each
      # build can hand its keychain items to the next (docs/release.md, macOS signing): without it,
      # no leg starts. As above, the secrets are only compared to the empty string inside env.
      - name: Require the macOS release certificate and its pin
        env:
          MACOS_CERTIFICATE_PRESENT: ${{ secrets.MACOS_CERTIFICATE != '' }}
          MACOS_CERTIFICATE_PASSWORD_PRESENT: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          MACOS_SIGNING_IDENTITY_PRESENT: ${{ secrets.MACOS_SIGNING_IDENTITY != '' }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY; do
            present="${name}_PRESENT"
            if [ "${!present}" != true ]; then
              echo "::error::the ${name} secret is missing; the macOS packages are signed with the release certificate (docs/release.md, macOS signing)"
              exit 1
            fi
          done
          jq -e '.certificate_sha1 | test("^[0-9A-F]{40}$")' .github/macos-signing.json >/dev/null

      # The Android packages are signed with the project's one key: without it, no leg starts.
      # As above, the secrets are only compared to the empty string inside env.
      - name: Require the Android release key and its pin
        env:
          ANDROID_KEYSTORE_BASE64_PRESENT: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD_PRESENT: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEY_PASSWORD_PRESENT: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            present="${name}_PRESENT"
            if [ "${!present}" != true ]; then
              echo "::error::the ${name} secret is missing; the Android packages are signed with the release key (docs/release.md, Android)"
              exit 1
            fi
          done
          .github/scripts/android-signing.sh "$ANDROID_SIGNING_FILE" >/dev/null

      - name: Render the bundle matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(python3 .github/scripts/tauri-release.py matrix --file "$RELEASE_TARGETS_FILE")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  bundle:
    name: Bundle ${{ matrix.target }}
    needs: [release-please, preflight]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Verify the tag resolves to the released commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_SHA" ]; then
            echo "::error::checked-out tag commit $head != release commit $RELEASE_SHA"
            exit 1
          fi

      # ubuntu-22.04 is the glibc floor documented by Tauri for Linux bundles.
      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-09-12
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      # target/ is retained per target: build scripts and C/C++ dependencies sit
      # outside any compiler cache and dominate Tauri rebuild time.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: tauri-release-${{ matrix.target }}
          cache-on-failure: true

      - name: Set up Bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up pnpm
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        if: env.PACKAGE_MANAGER != 'bun'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: ${{ env.PACKAGE_MANAGER }}

      - name: Install dependencies (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            *) echo "::error::unsupported PACKAGE_MANAGER '$PACKAGE_MANAGER'"; exit 1 ;;
          esac

      # Phase 1: frontend (build.beforeBuildCommand) and Rust compile. No
      # signing material is present while dependency code runs.
      - name: Build (no bundle, no secrets)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm) tauri=(npm run tauri --) ;;
            pnpm) tauri=(pnpm tauri) ;;
            bun) tauri=(bun run tauri) ;;
            *) echo "::error::unsupported PACKAGE_MANAGER '$PACKAGE_MANAGER'"; exit 1 ;;
          esac
          "${tauri[@]}" build --no-bundle --target "$TARGET"

      # The release certificate in a keychain of this job, trusted for code signing; Tauri signs
      # with it by its SHA-1 (APPLE_SIGNING_IDENTITY below). Only after phase 1: no dependency code
      # runs while the private key is on the runner.
      - name: Import the macOS release certificate
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: .github/scripts/macos-signing.sh import

      # Phase 2: bundling, code signing and updater signatures. The Tauri CLI
      # imports APPLE_CERTIFICATE into a temporary keychain itself and signs the
      # updater artifacts with TAURI_SIGNING_PRIVATE_KEY after bundling, so any
      # bundle.windows.signCommand output is what the .sig covers. Secrets are
      # scoped to the OS that needs them; empty values are unset because the
      # bundler treats an empty APPLE_CERTIFICATE as a certificate to import.
      - name: Bundle and sign
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          NODE_OPTIONS: --max_old_space_size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_CONTENT: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_CONTENT || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT \
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              unset "$name"
            fi
          done
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            # notarytool wants the App Store Connect key as a file.
            APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_KEY_CONTENT" >"$APPLE_API_KEY_PATH"
            export APPLE_API_KEY_PATH
            unset APPLE_API_KEY_CONTENT
          fi
          case "$PACKAGE_MANAGER" in
            npm) tauri=(npm run tauri --) ;;
            pnpm) tauri=(pnpm tauri) ;;
            bun) tauri=(bun run tauri) ;;
            *) echo "::error::unsupported PACKAGE_MANAGER '$PACKAGE_MANAGER'"; exit 1 ;;
          esac
          "${tauri[@]}" bundle --target "$TARGET" --bundles "$BUNDLES"

      # The app and the app in the updater's archive carry the requirement the app trusts: an ad hoc
      # or otherwise signed bundle would hand nothing over and must not ship.
      - name: Check the macOS signature against the pinned certificate
        if: matrix.platform == 'macos'
        env:
          TARGET: ${{ matrix.target }}
        run: .github/scripts/macos-signing.sh check "target/$TARGET/release/bundle"

      - name: Remove the macOS signing keychain
        if: always() && matrix.platform == 'macos'
        continue-on-error: true
        run: .github/scripts/macos-signing.sh remove

      # Copies dmg/nsis/msi/deb/rpm/AppImage (+ .sig) into dist/ with
      # collision-free names and records name/size/sha256 per file; macOS ships
      # its dmg and the .app.tar.gz (+ .sig) the updater installs. Fails when a
      # bundle is missing, or when a signed bundle of this updater build has no
      # .sig. `python3` is the one interpreter name
      # present on every hosted image (Ubuntu python-is-python3, Homebrew Python
      # on macOS, the python3.exe symlink in the Windows toolcache); bare
      # `python` is not on PATH on macos-15.
      - name: Collect bundles and evidence
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          python3 .github/scripts/tauri-release.py collect
          --project "$TAURI_PROJECT_PATH"
          --target "$TARGET"
          --targets-file "$RELEASE_TARGETS_FILE"
          --out dist
          --evidence "evidence/$TARGET.json"

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-${{ matrix.target }}
          path: |
            dist/
            evidence/
          if-no-files-found: error
          retention-days: 1

  # Android, arm64: Lockra_<version>_android_arm64.apk for the releases page and
  # Lockra_<version>_android_arm64.aab for Google Play. Gradle builds both unsigned with the
  # lockfile's Tauri CLI, as CI's `android` job does; the key is decoded in the signing step alone
  # and removed when it ends, so it never sits beside the dependencies' build code. The checks
  # require the certificate .github/android-signing.json pins, and the leg's checksums go with
  # the packages for the `updater` job to compare.
  bundle-android:
    name: Bundle aarch64-linux-android
    needs: [release-please, preflight]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Verify the tag resolves to the released commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_SHA" ]; then
            echo "::error::checked-out tag commit $head != release commit $RELEASE_SHA"
            exit 1
          fi

      - name: Android toolchain (JDK 21; SDK platform, build tools and NDK pinned)
        run: .github/scripts/android-toolchain.sh

      - name: Install Rust toolchain (and aarch64-linux-android)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-09-12
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: tauri-release-aarch64-linux-android
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the unsigned release APK and AAB (no secrets)
        working-directory: apps/mobile
        run: pnpm tauri android build --ci --target aarch64 --apk --aab

      - name: Sign with the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pin=$(.github/scripts/android-signing.sh "$ANDROID_SIGNING_FILE")
          ANDROID_KEY_ALIAS=${pin#* }
          export ANDROID_KEY_ALIAS ANDROID_KEYSTORE=$RUNNER_TEMP/lockra-release.jks
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$ANDROID_KEYSTORE")
          unset ANDROID_KEYSTORE_BASE64
          out=apps/mobile/src-tauri/gen/android/app/build/outputs
          .github/scripts/sign-android-package.sh "$out/apk/universal/release/app-universal-release-unsigned.apk" \
            "$out/bundle/universalRelease/app-universal-release.aab" android-bundle "$VERSION"

      - name: Check the packages against the pinned certificate
        run: |
          set -euo pipefail
          pin=$(.github/scripts/android-signing.sh "$ANDROID_SIGNING_FILE")
          .github/scripts/check-android-package.sh "android-bundle/apk/Lockra_${VERSION}_android_arm64.apk" \
            "android-bundle/aab/Lockra_${VERSION}_android_arm64.aab" "${pin%% *}" "$VERSION"

      # The packages under their release names, and their checksums apart (evidence/*.json is the
      # desktop legs' format, which names an updater bundle the phone does not have).
      - name: Collect the packages and their checksums
        run: |
          set -euo pipefail
          mkdir -p dist evidence
          cp "android-bundle/apk/Lockra_${VERSION}_android_arm64.apk" "android-bundle/aab/Lockra_${VERSION}_android_arm64.aab" dist/
          (cd dist && sha256sum -- *) >evidence/aarch64-linux-android.sha256

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-aarch64-linux-android
          path: |
            dist/
            evidence/
          if-no-files-found: error
          retention-days: 1

  updater:
    name: Updater manifest and assets
    needs: [release-please, preflight, bundle, bundle-android]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Tooling only; no project or dependency code executes in this job.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download every bundle leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tauri-*
          path: bundle
          merge-multiple: true

      # The Android packages arrived as their leg wrote them, and both of them.
      - name: Check the Android packages against their leg's checksums
        working-directory: bundle/dist
        run: sha256sum --check --strict ../evidence/aarch64-linux-android.sha256

      - name: Install minisign
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign

      # Decodes the base64 pubkey and each base64 .sig exactly as
      # tauri-plugin-updater does, then verifies with minisign. A signature made
      # with a rotated or wrong key stops the release here, not on user devices.
      - name: Verify every updater signature against the configured pubkey
        if: needs.preflight.outputs.updater_enabled == 'true'
        env:
          PUBKEY: ${{ needs.preflight.outputs.pubkey }}
        run: >-
          python3 .github/scripts/tauri-release.py verify-signatures
          --dist bundle/dist --pubkey "$PUBKEY" --expect-updater

      - name: Read release notes from the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release view "$TAG" --repo "$REPO" --json body --jq .body >body.md

      # Single writer: one latest.json after all legs, URLs pinned to this tag
      # (never releases/latest/download, which would point at whatever is
      # published next), every manifest platform required.
      - name: Build latest.json
        if: needs.preflight.outputs.updater_enabled == 'true'
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: >-
          python3 .github/scripts/tauri-release.py updater-json
          --dist bundle/dist
          --evidence-dir bundle/evidence
          --repo "$REPO"
          --tag "$TAG"
          --version "$VERSION"
          --notes-file body.md
          --targets-file "$RELEASE_TARGETS_FILE"
          --out bundle/dist/latest.json

      - name: Generate SHA256SUMS
        working-directory: bundle/dist
        run: |
          set -euo pipefail
          files=$(find . -maxdepth 1 -type f -printf '%P\n' | LC_ALL=C sort)
          if [ -z "$files" ]; then
            echo "::error::no shipped files were downloaded"
            exit 1
          fi
          printf '%s\n' "$files" | xargs sha256sum >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS

      - name: Attest shipped files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bundle/dist/*

      - name: Attach assets to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$REPO" --clobber bundle/dist/*

      - name: Verify remote assets against SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          bash .github/scripts/publish-release-draft.sh --verify-only
          --checksums bundle/dist/SHA256SUMS --expect-name SHA256SUMS --exact

      - name: Upload checksums for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: bundle/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [release-please, updater]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums

      # Re-verifies every remote asset (name, size, sha256 digest), then flips
      # draft=false and adds --latest unless the release is a prerelease.
      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          bash .github/scripts/publish-release-draft.sh --publish
          --checksums SHA256SUMS --expect-name SHA256SUMS --exact
