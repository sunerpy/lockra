<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- The source of every icon in this directory: `cargo tauri icon` renders the rest from a 1024 px
       PNG of this file (scripts/build-icons.sh). The brand's blue-violet tile (user choice
       2026-10-11, option C of the Penpot page 「00 · Logo」) holding a white padlock, its body showing
       a masked code; inside the app, packages/ui/src/components/Logo.tsx draws the same padlock on
       the theme's card instead. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#tile)"/>
  <path d="M37 45 V36 A13 13 0 0 1 63 36 V45" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <rect x="26" y="43" width="48" height="37" rx="9" fill="#FFFFFF"/>
  <circle cx="38" cy="61.5" r="4.2" fill="#5B6BFF"/>
  <circle cx="50" cy="61.5" r="4.2" fill="#5B6BFF"/>
  <circle cx="62" cy="61.5" r="4.2" fill="#5B6BFF"/>
</svg>
