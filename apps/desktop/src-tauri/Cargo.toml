[package]
name = "lockra-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lockra desktop shell (Windows, macOS, Linux)."
publish = false

[lints]
workspace = true

[lib]
name = "lockra_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
# The version of the extension the build carries, checked against the release's (build.rs).
serde_json.workspace = true
tauri-build = { version = "=2.6.3", features = [] }
tauri-codegen = "=2.6.3"

[dependencies]
# The clipboard lives on its own thread: on Linux the process that set the clipboard serves it.
arboard.workspace = true
# The pipe's name is a hash of the config folder (src/browser/socket.rs).
data-encoding.workspace = true
# Host mode finds the app's folders before any Tauri context, as Tauri does (src/browser.rs).
dirs = "=6.0.0"
keyring.workspace = true
lockra-browser.workspace = true
lockra-bridge.workspace = true
lockra-core.workspace = true
# The sync storage, opened only for a space the user set up (src/sync.rs, docs/security.md).
lockra-remote.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# The name of a build's own keychain items: a hash of its code signature (src/code_identity.rs).
sha2.workspace = true
# CVE-2026-42184 / GHSA-7gmj-67g7-phm9 (remote pages reaching local-only IPC) is fixed from 2.11.1.
# The tray while Lockra runs in the background (src/background.rs).
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png"] }
# Native file dialogs, called from Rust only: the webview never holds a path (docs/security.md).
tauri-plugin-dialog = "=2.7.3"
# The quick search's global shortcut (src/quick_access.rs), registered from Rust only and only once
# one is chosen: the webview has no permission for the plugin. 2.4 needs tauri 2.12.
tauri-plugin-global-shortcut = "=2.3.2"
# One process writes the vault: a second start focuses the first window instead.
tauri-plugin-single-instance = { version = "=2.4.3", default-features = false }
# In-app updates, driven from Rust only when the user asks (src/updater.rs): the webview has no
# permission for the plugin. rustls with the operating system's roots; the system proxy is honoured.
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
] }
# The tray's words in the system's language when the app follows it (src/background.rs).
sys-locale = "=0.3.2"
thiserror.workspace = true
# Host mode's stdio (src/browser/host.rs).
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true
# Not used from Rust: pinned so that a `cargo update` cannot pull tauri 2.12's runtime under tauri
# 2.11.6 (measured 2026-10-01: tauri-runtime 2.12.0 changed `primary_monitor()` to return a Result
# and tauri 2.11.6 no longer compiles against it). Move them together with `tauri` when upgrading.
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"
tauri-utils = "=2.9.3"
wry = { version = "=0.55.1", default-features = false }
tao = { version = "=0.35.3", default-features = false }

# Touch ID and Windows Hello before "remember on this device" unlocks (src/biometrics.rs). Their
# unsafe platform calls stay inside robius-authentication: the workspace still forbids unsafe code.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
robius-authentication = "=0.3.1"

# The keychain hand-over of a macOS update (src/handoff.rs): the verified update is expanded next
# to the running build, as the updater itself does, with the same crates it uses.
[target.'cfg(unix)'.dependencies]
flate2 = "=1.1.10"
# This process's user, for the browser socket's folder and peers (src/browser/socket.rs).
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
tar = "=0.4.46"
tempfile.workspace = true

# The login keychain and the code-signing checks of the hand-over, through safe calls only
# (src/macos_keychain.rs, src/keychain_handoff.rs): the same version keyring already uses.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

# Whether Windows Hello is set up (UserConsentVerifier), on the version tauri builds on.
[target.'cfg(windows)'.dependencies]
# The native-messaging hosts' registry keys under HKCU (src/browser/manifest.rs).
winreg = "=0.56.0"
windows = { version = "=0.61.3", default-features = false, features = [
  "std",
  "Security_Credentials_UI",
] }

[dev-dependencies]
lockra-core = { workspace = true, features = ["fakes"] }
lockra-sync.workspace = true
lockra-vault = { workspace = true, features = ["test-kdf"] }
tauri = { version = "=2.11.6", features = ["test"] }
tempfile.workspace = true
