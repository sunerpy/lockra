    <mask id="dots">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="38" cy="61.5" r="4.2" fill="#000"/>
      <circle cx="50" cy="61.5" r="4.2" fill="#000"/>
      <circle cx="62" cy="61.5" r="4.2" fill="#000"/>
