<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- One colour (the launcher tints it); the keyhole is cut out of the lock. -->
  <defs>
    <mask id="keyhole">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="55.5" r="3.5" fill="#000"/>
      <rect x="48.25" y="56" width="3.5" height="7" rx="1.75" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(50 50) scale(0.8) translate(-50 -50)" fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M50 18 A32 32 0 1 1 18 50" stroke-width="8"/>
    <path d="M42 47 V42 A8 8 0 0 1 58 42 V47" stroke-width="6"/>
    <rect x="36" y="46" width="28" height="23" rx="5" fill="#fff" stroke="none" mask="url(#keyhole)"/>
  </g>
</svg>
