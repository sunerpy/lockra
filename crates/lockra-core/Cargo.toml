[package]
name = "lockra-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The application core: session, entries, import, export, backup, settings and sync."
publish = false

[lints]
workspace = true

[features]
# The fakes behind the ports (clock, clipboard, keychain, code sink, sync storage) for the test
# suites of the bridge and the desktop shell.
fakes = []

[dependencies]
data-encoding.workspace = true
lockra-autofill.workspace = true
lockra-otp.workspace = true
lockra-sync.workspace = true
lockra-transfer.workspace = true
lockra-vault.workspace = true
parking_lot.workspace = true
serde.workspace = true
# `raw_value`: a part of the vault's local part is read where it lies, leniently (src/lenient.rs).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
image.workspace = true
# The KeePass databases and 1Password's zips the import tests read.
keepass = { workspace = true, features = ["save_kdbx4"] }
proptest.workspace = true
lockra-vault = { workspace = true, features = ["test-kdf"] }
qrcode = { workspace = true, features = ["image"] }
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
