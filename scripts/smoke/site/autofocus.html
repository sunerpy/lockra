<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in (autofocus) · login.test</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <form id="login" action="/welcome.html" method="get">
      <label
        >User name <input id="username" name="username" autocomplete="username" autofocus
      /></label>
      <label
        >Password
        <input id="password" name="password" type="password" autocomplete="current-password"
      /></label>
      <button id="submit" type="submit">Sign in</button>
    </form>
  </body>
</html>
